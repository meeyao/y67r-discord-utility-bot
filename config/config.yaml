discord:
  token: "YOUR_DISCORD_BOT_TOKEN"
  alias: "$convert"
  additional_aliases:
    - "$currency"
    - "!roll"
    - "!conch"
    - "!time"
    - "!weather"
    - "!temps"
    - "%"
  allowed_channel_ids: []
  allowed_guild_ids: []
  status: "metric ↔ imperial"

currency:
  default_targets:
    - USD
    - EUR
    - CAD
    - GBP
  cache_minutes: 180
  api_url: https://open.er-api.com/v6/latest/{base}

sanitize:
  instagram: true
  reddit: false
  tiktok: true
  twitch: false
  twitter: true
